<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="./Images/microsoft.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Sign in to your account</title>

    <style>
body {
    min-height: 100vh;
    background-color: #ffffff;
    font-family: "Segoe UI", Arial, sans-serif;
}

.ms-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.ms-logo-text {
    font-size: 18px;
    color: #5e5e5e;
}

.login-form {
    width: 100%;
    max-width: 380px;
    background-color: #ffffff;
    border: 1px solid #d6d6d6;
    border-radius: 16px;
    padding: 28px 38px 18px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
}

.form-title {
    font-size: 24px;
    font-weight: 600;
    color: #1b1b1b;
    margin-bottom: 14px;
}

.form-group {
    margin-bottom: 8px;
}

.form-group label {
    font-size: 14px;
    color: #1b1b1b;
    margin-bottom: 3px;
}

.form-group input {
    width: 100%;
    height: 38px;
    padding: 5px 14px;
    border: 1px solid #666666;
    border-radius: 20px;
    outline: none;
    font-size: 14px;
}

.form-group input:focus {
    border: 2px solid #0067b8;
}

.form-group input.valid {
    border: 2px solid #107c10;
}

.form-group input.error {
    border: 2px solid #d13438;
}

.validation-message {
    font-size: 12px;
    margin: 2px 0 0 8px;
    min-height: 14px;
}

.login-button {
    width: 100px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background-color: #0067b8;
    color: white;
    font-size: 14px;
}

.login-button:hover {
    background-color: #005da6;
}
    </style>
</head>

<body class="d-flex flex-column justify-content-center align-items-center">

    <div class="ms-logo">

        <img src="./Images/microsoft.png"
            alt="Microsoft"
            width="28"
            height="28">

        <span class="ms-logo-text">
            Microsoft
        </span>

    </div>

    <form action=""
        name="register"
        enctype="multipart/form-data"
        method="post"
        id="form"
        class="login-form">

        <div class="form-title">
            Sign in
        </div>

        <div class="form-group">

            <label for="userid" class="form-label">
                User Name :
            </label>

            <input type="text"
                name="fname"
                id="userid">

            <p id="usererror"
                class="validation-message text-danger">
            </p>

            <p id="usersucess"
                class="validation-message text-success">
            </p>

        </div>

        <div class="form-group">

            <label for="email" class="form-label">
                Email ID :
            </label>

            <input type="text"
                name="email"
                id="email">

            <p id="eamilerror"
                class="validation-message text-danger">
            </p>

            <p id="eamilsucess"
                class="validation-message text-success">
            </p>

        </div>

        <div class="form-group">

            <label for="pwd1" class="form-label">
                Password :
            </label>

            <input type="password"
                name="pass1"
                id="pwd1">

            <p id="pwd1error"
                class="validation-message text-danger">
            </p>

            <p id="psw1sucess"
                class="validation-message text-success">
            </p>

        </div>

        <div class="form-group">

            <label for="pwd2" class="form-label">
                Confirm Password :
            </label>

            <input type="password"
                name="pass2"
                id="pwd2">

            <p id="pwd2error"
                class="validation-message text-danger">
            </p>

            <p id="psw2sucess"
                class="validation-message text-success">
            </p>

        </div>

        <div class="d-flex justify-content-end mt-2">

            <button type="submit"
                class="login-button">
                Sign in
            </button>

        </div>

    </form>

    <script>

        const fname = document.getElementById('userid');
        const email = document.getElementById('email');
        const pass1 = document.getElementById('pwd1');
        const pass2 = document.getElementById('pwd2');
        const form = document.getElementById('form');

        function showError(input, errorId, successId, message) {

            input.classList.remove("valid");
            input.classList.add("error");

            document.getElementById(errorId).textContent = message;
            document.getElementById(successId).textContent = "";

        }

        function showSucess(input, errorId, successId, message) {

            input.classList.add("valid");
            input.classList.remove("error");

            document.getElementById(errorId).textContent = "";
            document.getElementById(successId).textContent = "";

        }

        function resetError() {

            document.getElementById("usererror").textContent = "";
            document.getElementById("eamilerror").textContent = "";
            document.getElementById("pwd1error").textContent = "";
            document.getElementById("pwd2error").textContent = "";

            document.getElementById("usersucess").textContent = "";
            document.getElementById("eamilsucess").textContent = "";
            document.getElementById("psw1sucess").textContent = "";
            document.getElementById("psw2sucess").textContent = "";

            fname.classList.remove("valid", "error");
            email.classList.remove("valid", "error");
            pass1.classList.remove("valid", "error");
            pass2.classList.remove("valid", "error");
        }

        function usercheck() {

            const value = fname.value.trim();

            if (value === "") {

                showError(
                    fname,
                    "usererror",
                    "usersucess",
                    "Name Is Required"
                );

                return false;

            } else if (value !== "user") {

                showError(
                    fname,
                    "usererror",
                    "usersucess",
                    "U Are Not Valid User"
                );

                return false;

            } else {

                showSucess(
                    fname,
                    "usererror",
                    "usersucess",
                    "Welcome Back..🎉🎉"
                );

                return true;
            }
        }

        function emailcheck() {

            const value = email.value.trim();

            if (value === "") {

                showError(
                    email,
                    "eamilerror",
                    "eamilsucess",
                    "Email ID Is Required"
                );

                return false;

            } else if (value !== "user@gmail.com") {

                showError(
                    email,
                    "eamilerror",
                    "eamilsucess",
                    "This is Not A valid Email ID"
                );

                return false;

            } else {

                showSucess(
                    email,
                    "eamilerror",
                    "eamilsucess",
                    "Email ID Is Correct"
                );

                return true;
            }
        }

        function password1() {

            const pwd = pass1.value.trim();

            if (pwd === "") {

                showError(
                    pass1,
                    "pwd1error",
                    "psw1sucess",
                    "Password Is Required"
                );

                return false;

            } else if (pwd !== "1234") {

                showError(
                    pass1,
                    "pwd1error",
                    "psw1sucess",
                    "Enter the Valid Password"
                );

                return false;

            } else {

                showSucess(
                    pass1,
                    "pwd1error",
                    "psw1sucess",
                    "Correct Password"
                );

                return true;
            }
        }

        function password2() {

            const pwd1 = pass1.value.trim();
            const pwd2 = pass2.value.trim();

            if (pwd2 === "") {

                showError(
                    pass2,
                    "pwd2error",
                    "psw2sucess",
                    "Confirm Password Is Required"
                );

                return false;

            } else if (pwd2 !== pwd1) {

                showError(
                    pass2,
                    "pwd2error",
                    "psw2sucess",
                    "Password Incorrect"
                );

                return false;

            } else {

                showSucess(
                    pass2,
                    "pwd2error",
                    "psw2sucess",
                    "Correct Confirm Password"
                );

                return true;
            }
        }

        fname.addEventListener("input", usercheck);
        email.addEventListener("input", emailcheck);
        pass1.addEventListener("input", password1);
        pass2.addEventListener("input", password2);

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            const check1 = usercheck();
            const check2 = emailcheck();
            const check3 = password1();
            const check4 = password2();

            if (check1 && check2 && check3 && check4) {

                alert("Login Successfully..🎉🎉🎉🎉");

                window.location.href = "MicroSoftIndex.html";

                resetError();
                form.reset();

            } else {

                alert("There is Error in Login..❌❌");

            }

        });

    </script>

</body>

</html>
